resume: null
model: 
  model_type: prorna_ssdn
  esm_type: 650M
  pooling: token
  output_dim: 1
  fix_lms: true
  pair_dim: 40
  dist_dim: 40
  representation_layer: 33
  fusion:
    type: ssdn_enhanced
    use_enhanced: true
    num_layers: 8
    num_heads: 4
    pair_dim: 40
    cross_heads_start: 4
    dropout: 0.1
  interaction_adapter:
    enable: false
    embed_dim: 320
    num_heads: 8
    dropout: 0.0

train:
  temperature: 0.2
  max_iters: 30_000
  val_freq: 1000
  seed: 42
  max_grad_norm: 100.0
  optimizer:
    type: adam
    lr: 3.e-5
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.8
    patience: 5
    min_lr: 1.e-6
