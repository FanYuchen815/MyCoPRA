output_dir: ./outputs/PRORNA_SSDN_pretrain_enhanced_debug
run_name: PRORNA_SSDN_pretrain_enhanced_debug
num_folds: 1
epochs: 1
patience: 50
gpus: 1
wandb: false
ckpt: null
ckpts: []
precision: 16
batch_size: 4
accumulate_grad_batches: 16
model_config: config/models/prorna_ssdn.yml
data_config: config/datasets/PRI30k.yml

# Limit batches for quick debug
limit_train_batches: 1
limit_val_batches: 1

# Causal pretraining flags (read by PretuneModule)
causal_enabled: true
causal_pretrain:
  alignment_weight: 0.1
  atomic_weight: 1.0
  global_weight: 1.0
  local_weight: 1.0
save_every_n_epochs: 10
